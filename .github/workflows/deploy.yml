name: Deploy

# On merge to main: build + push the three images to GHCR (tagged with the
# commit SHA + latest), then tell the EC2 box to pull that SHA and restart —
# all via AWS SSM (no SSH, no stored AWS keys; auth is GitHub OIDC).
#
# Required repo settings (Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::<acct>:role/github-actions-deploy
#   AWS_REGION           us-east-1
#   INSTANCE_ID          i-0dd84dd99c8899f32
#
# GHCR packages (boneless-api/bot/web) must be set to Public once, after the
# first push, so the box can pull them anonymously (no creds on the box).
# Images live under the org namespace — the repo's GITHUB_TOKEN can push there;
# pushing to a personal namespace (d0nm3ga/*) fails after the repo moved orgs.

env:
  GHCR_IMAGE_PREFIX: ghcr.io/the-boneless-island

on:
  push:
    branches: [main]
    # Docs-only merges (this file's own worktree writes plan/README updates
    # constantly) shouldn't trigger a full build+push+SSM deploy — there's
    # nothing in these paths that changes any of the three images or the box
    # config. Keep this list narrow: anything under `docs/` or `.cursor/` is
    # genuinely docs, but don't add app source directories here even if a
    # change "looks docs-only" (e.g. a comment-only diff) — the deploy is
    # cheap to skip correctly and expensive to skip incorrectly.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".cursor/**"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the OIDC token for AWS
  packages: write # push to GHCR

jobs:
  build-push-deploy:
    # ARM runner: the prod box is arm64 (EC2 t4g/Graviton), so images must be
    # built arm64-native. GitHub's arm64 hosted runners are free for public
    # repos. (Default x86 runners produce amd64 images the box can't run:
    # "no matching manifest for linux/arm64/v8".)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build + push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-api:latest
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build + push bot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-bot:latest
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-bot:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Build + push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://api.bonelessisland.com
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-web:latest
            ${{ env.GHCR_IMAGE_PREFIX }}/boneless-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to box via SSM
        # `docker system prune -af` runs BEFORE the pull: every deploy adds three
        # SHA-tagged images (api/bot/web) that the trailing `docker image prune -f`
        # never reaps (they aren't dangling), so the box's disk leaks until a pull
        # dies with "no space left on device". Pruning first reclaims old images
        # (running containers' images are protected; named volumes are untouched, so
        # Postgres data is safe) and lets the pull always have room.
        #
        # `--replace-all` (not `--add`) on `git config safe.directory`: this script
        # reruns on every deploy, and `--add` appends a duplicate entry to
        # ~/.gitconfig each time — harmless functionally, but the file grows forever
        # and duplicate entries make `git config --get-all` confusing when debugging
        # the box by hand. `--replace-all` keeps exactly one entry.
        #
        # `up -d --wait --wait-timeout 240`: makes the deploy step honest. Without
        # `--wait`, `up -d` returns as soon as containers are *started*, not once
        # they're actually healthy — so a migration that exits 1 (api container
        # stuck unhealthy/restarting) previously still reported deploy success. Now
        # compose blocks until every service with a healthcheck reports healthy (or
        # the 240s timeout elapses) and exits non-zero if it doesn't, which the `||`
        # below catches to print diagnostics before failing the Actions job for real.
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters commands='["set -e","export HOME=/root","cd /home/ssm-user/thebonelessisland","git config --global --replace-all safe.directory /home/ssm-user/thebonelessisland","git fetch origin main","git reset --hard origin/main","export IMAGE_TAG=${{ github.sha }}","docker system prune -af","docker compose -f infra/docker-compose.yml --profile prod pull","docker compose -f infra/docker-compose.yml --profile prod up -d --wait --wait-timeout 240 || { echo \"--- deploy failed: compose did not reach healthy within the wait timeout ---\"; docker compose -f infra/docker-compose.yml --profile prod ps; echo \"--- last 100 api log lines ---\"; docker compose -f infra/docker-compose.yml --profile prod logs --tail=100 api; exit 1; }","docker image prune -f"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $CMD_ID"

          # Poll get-command-invocation ourselves instead of `aws ssm wait
          # command-executed`: that waiter gives up (WaiterError) after its fixed
          # retry budget on a command that's still InProgress and, worse, was being
          # swallowed here with `|| true` — so a genuinely still-running (or hung)
          # remote script was falling through to read a stale/empty Status as if the
          # command had finished. Poll on our own terminal-status check instead, capped
          # at ~10 minutes (60 x 10s), which comfortably covers the compose --wait
          # timeout above (240s) plus image pulls and the git/prune steps before it.
          TERMINAL_STATUSES="Success Failed Cancelled TimedOut Undeliverable Terminated"
          STATUS="InProgress"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query Status --output text)
            case " $TERMINAL_STATUSES " in
              *" $STATUS "*) break ;;
            esac
            sleep 10
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" --query StandardErrorContent --output text
          echo "deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
