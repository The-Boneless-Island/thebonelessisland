# Postgres for local dev AND the full single-box production stack.
#
# DEV (just the database, app runs on the host via `npm run dev`):
#   docker compose -f infra/docker-compose.yml up -d            # postgres only
#   — or the shortcut —  npm run db:up
#
# PROD (edge + api + bot + postgres, all on one EC2 box):
#   docker compose -f infra/docker-compose.yml --profile prod up -d --build
#
# The api/bot/web services are gated behind the `prod` profile so the dev
# `db:up` shortcut keeps starting only Postgres.
#
# Env (prod): every app service reads ../.env. Two supported shapes
# (see .env.example):
#   • env-file mode — .env holds all secrets, SECRETS_SOURCE unset.
#   • SSM mode      — .env holds only NODE_ENV=production, SECRETS_SOURCE=ssm,
#                     AWS_REGION, POSTGRES_PASSWORD; api/bot pull the rest from
#                     /boneless/prod/* via the EC2 instance role at startup.
#
# In prod, DATABASE_URL must use the compose service name as host:
#   postgresql://postgres:<pw>@postgres:5432/boneless

# Cap container log files so they can't fill the box's disk (10MB × 3 files
# per service). Each service references this via `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # pgvector/pgvector:pg16 is the official Postgres 16 image with the
    # pgvector extension pre-installed. Same upstream PG, just adds the
    # CREATE EXTENSION vector path. Existing volume + data carries over
    # cleanly when swapping from postgres:16 → pgvector/pgvector:pg16.
    image: pgvector/pgvector:pg16
    container_name: boneless-postgres
    restart: unless-stopped
    logging: *default-logging
    # POSTGRES_PASSWORD comes from the same .env as the app services. The path
    # is relative to THIS compose file (→ repo root), so it resolves no matter
    # which directory `docker compose` is invoked from. Using env_file instead
    # of `${POSTGRES_PASSWORD}` interpolation avoids the footgun where compose
    # looks for `.env` in the compose file's directory (infra/) rather than the
    # repo root and silently falls back to a default password — which mismatches
    # the app's DATABASE_URL. Requires a .env at the repo root (dev: copy from
    # .env.example; prod: see DEPLOY.md). First-time volume init pins the
    # password; to rotate: `docker compose down -v`, change it, up, re-migrate.
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: boneless
      POSTGRES_USER: postgres
    ports:
      # Bind to loopback only. Dev (host app) reaches it at localhost:5432.
      # In prod the app containers use the internal network, not this mapping,
      # so nothing on the box's public interface ever exposes Postgres.
      - "127.0.0.1:5432:5432"
    volumes:
      - boneless_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boneless"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Largest share of the box's 2GB — Postgres benefits most from spare
    # memory (shared_buffers, OS page cache for the working set). The other
    # three services are capped smaller so this has room: 768+256+128+640 =
    # 1792m, leaving ~250m host headroom for the kernel/docker/ssm-agent on a
    # 2GB box.
    mem_limit: 640m

  api:
    profiles: ["prod"]
    # Prod pulls a prebuilt image from GHCR (CI builds + pushes it). IMAGE_TAG
    # is set inline by the deploy command (the commit SHA); falls back to
    # `latest` for manual runs. `build:` is kept for local/CI image builds —
    # `docker compose build` tags the result with this same image name.
    image: ghcr.io/the-boneless-island/boneless-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: boneless-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports — Caddy (web service) reaches it as http://api:3000 on
    # the internal network. Migrations run automatically on boot (server.ts).
    expose:
      - "3000"
    volumes:
      # Forum image uploads (apps/api/src/lib/forumUploads.ts). Without this the
      # api container is stateless-by-accident: every `docker compose up` that
      # recreates the container (every deploy) silently deletes anything a member
      # uploaded, because the files only ever lived in the container's writable
      # layer. The path must match forumUploads.ts's default exactly — it resolves
      # uploads to `path.join(process.cwd(), "data", "uploads")`, and the
      # Dockerfile sets WORKDIR /app/apps/api before CMD, so cwd is
      # /app/apps/api and the default resolves to this same path.
      - boneless_uploads:/app/apps/api/data/uploads
    # Caps the api container's memory so a leak/spike can't starve the box (2GB
    # total, four services). 512m is the Node heap ceiling (NODE_OPTIONS below);
    # 768m gives headroom above the heap for non-heap memory (buffers, native
    # deps like sharp's libvips) before the OOM killer would step in.
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    healthcheck:
      # Hits the app's own readiness probe (server.ts) instead of just "is the
      # process up" — it reports 503 while migrations are still running or have
      # failed, so compose (and deploy.yml's --wait) won't call the api healthy
      # until it can actually serve traffic. Plain `node -e` avoids depending on
      # curl/wget being present in the api image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run on every boot (server.ts) before the api starts serving,
      # so the first healthy check needs enough slack to cover a full migration
      # run, not just process startup.
      start_period: 90s

  bot:
    profiles: ["prod"]
    image: ghcr.io/the-boneless-island/boneless-bot:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    container_name: boneless-bot
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    depends_on:
      api:
        # Wait for the api's own healthcheck (not just "container started") —
        # the bot's /internal/* calls (announcements, settings cache,
        # slash-command autocomplete) 404/500 until the api has finished
        # migrating and is actually accepting requests.
        condition: service_healthy
    # Outbound only (Discord gateway). No ports.
    # 256m covers discord.js's gateway cache + the bot's own small heap; the
    # box has far more headroom to spare here than on the api container.
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192

  web:
    profiles: ["prod"]
    image: ghcr.io/the-boneless-island/boneless-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the SPA at build time. Must match the public API hostname.
        VITE_API_BASE_URL: https://api.bonelessisland.com
    container_name: boneless-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        # Deliberately NOT service_healthy: the SPA is static and can serve
        # (with the api proxy 502ing briefly) while the api boots/migrates.
        # Gating web on api health would turn every migration run into full
        # site downtime instead of a degraded-api window.
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cloudflare Origin CA cert + key (see DEPLOY.md). Read-only.
      - ./certs:/certs:ro
      # Persist Caddy's state dir.
      - boneless_caddy_data:/data
    # Caddy + a small static build; the lightest service on the box by far.
    mem_limit: 128m
    healthcheck:
      # /healthz is an internal-only route in infra/Caddyfile that just
      # confirms the Caddy process is up and serving — it doesn't prove the
      # SPA build or the api proxy work, but "Caddy didn't start" is the
      # failure mode this actually catches. wget is busybox's, bundled in
      # caddy:2-alpine; there's no curl in this image.
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  boneless_pg_data:
  boneless_caddy_data:
  # Forum upload files (see the api service's volumes entry above). Named
  # volume so it survives `docker compose up` container recreation on every
  # deploy — only `docker compose down -v` or an explicit `docker volume rm`
  # touches it.
  boneless_uploads:
